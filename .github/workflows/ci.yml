name: CI

on:
  pull_request:
    branches: [trunk]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Lint (ktlint)
        run: ./gradlew ktlintCheck

      - name: Lint (detekt)
        run: ./gradlew detekt

      - name: Build
        run: ./gradlew assembleDebug

      - name: Test
        run: ./gradlew test
